name: Horaires de prière

on:
  schedule:
    - cron: "17 1 * * *"   # chaque nuit vers 2 h, heure de Paris
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/maj-horaires.mjs
      - name: Enregistrer
        run: |
          if git diff --quiet -- horaires.json 2>/dev/null && git ls-files --error-unmatch horaires.json >/dev/null 2>&1; then
            echo "Rien à enregistrer"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add horaires.json
          git commit -m "Horaires de prière du $(date +%F)"
          git push
